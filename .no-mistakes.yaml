# Trusted no-mistakes gate configuration.
#
# commands.test is the fast baseline: mobile and engine lint and typecheck,
# plus the Jest tests related to the files changed since origin/main.
# The full suites stay in the required CI checks on the PR, never twice:
# full mobile Jest, engine tests, the floor guard journey and the Expo
# prebuild run in `mobile`; native JVM tests and the Android build in `native`.
commands:
  prepare: cd mobile && npm ci && cd ../packages/engine && npm ci
  test: cd mobile && npm run lint && npm run typecheck && npx jest --runInBand --ci --passWithNoTests --changedSince=origin/main && cd ../packages/engine && npm run lint && npm run typecheck

test:
  # The baseline above is the whole validation story. Do not boot, attach
  # to, or install on any Android emulator or device: this baseline runs
  # headless lint, typecheck and Jest. Device journeys stay manual
  # per mobile/README.md.
  instructions: |
    Trust the commands.test baseline result as the primary evidence.
    Beyond it, run only the tests for the changed parts, never a whole suite
    again: CI runs the full suite on the PR. Changed mobile/ files: `cd mobile
    && npx jest --ci --findRelatedTests <changed files>`; changed
    packages/engine/ files: the engine test files for those modules; changed
    mobile/modules/ownvoice-native/: `./gradlew :ownvoice-native:testDebugUnitTest`
    from mobile/android. Docs-only changes need no tests.
    Then run exactly one user journey from .done-done.yaml: the journey for
    the changed feature, or `done-done run engine-protocol` (host, no device)
    when no journey covers it or no device is allocated. Run an Android
    journey only with an explicit device allocation. Check captures with
    `done-done check --outcome "<what a user can now do>" <files>` and
    record with `done-done receipt`. The visual guard is the `done-done design` primitive over the journey's captures
    against the PR's approved mocks. Do not start, connect to, install
    anything on, or change settings on any Android emulator or physical
    device without an explicit device allocation naming it; the test phone
    is never eligible.
