# Trusted no-mistakes gate configuration.
#
# commands.test runs mobile lint/typecheck/Jest, the engine's host checks, and
# the real-CLI floor guard integration journey.
# Only shared slop/thread tests with passing real-CLI coverage were removed;
# uncovered mobile suites remain until a passing journey replaces them.
# Native JVM coverage is retained in the path-filtered CI job and this gate.
# Assemble steps are excluded: this is validation, not a build.
commands:
  prepare: cd mobile && npm ci && cd ../packages/engine && npm ci
  test: cd mobile && npm run lint && npm run typecheck && npm test -- --ci && cd ../packages/engine && npm run lint && npm run typecheck && npm test && cd ../../mobile && npx expo prebuild -p android --no-install && cd android && ./gradlew :ownvoice-native:testDebugUnitTest && cd ../.. && root="$(mktemp -d)" && HOME="$root" XDG_CONFIG_HOME="$root" TMPDIR="$root" node scripts/integration/floor-guard.mjs "$root/scratch" "$root/evidence"

test:
  # The baseline above is the whole validation story. Do not boot, attach
  # to, or install on any Android emulator or device: this baseline runs
  # headless Jest, node --test and JVM checks. Device journeys stay manual
  # per mobile/README.md.
  instructions: |
    Trust the commands.test baseline result as the primary evidence.
    For behavioral proof beyond the baseline, follow
    .agents/skills/verify-ownvoice/SKILL.md and its features/ map: drive one
    mapped feature with the named instrument and keep evidence under
    verify-artifacts/. The engine-protocol feature runs on the host with no
    device. Do not start, connect to, install anything on, or change settings
    on any Android emulator or physical device without an explicit device
    allocation naming it; the test phone is never eligible.
