<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Allow restricted settings for Ownvoice</title>
  <desc id="desc">Illustration of Ownvoice App info: open the three-dot menu at the top right and choose Allow restricted settings.</desc>
