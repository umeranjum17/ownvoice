# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "ownvoice"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Proof map for Ownvoice (migrated from .agents/skills/verify-ownvoice, deleted:
# SKILL.md, evidence.sh, visual-check.sh and the features/ map live on here as
# journeys and primitives, not as a skill).
#
# Surfaces: the host surface is the published ownvoice-engine CLI
# (packages/engine, model-free JSON protocol, no device); the primary surface
# is the Android app (mobile/), driven by mobile/e2e/ drivers on a throwaway
# emulator. Engine proof says nothing about Android behavior, and vice versa.
#
# Evidence: each journey saves the command, stdout, stderr and exit code into
# its own run folder ($DONE_DONE_EVIDENCE_ROOT, one folder per run, outside
# the repo; never commit media). Android captures still land in the stable
# gitignored verify-artifacts/<task>/ folders via mobile/e2e/evidence.sh;
# the run folder holds the driver log and transcript.
#
# Capture matrix (was evidence.sh pair): before/after x light/dark at phone
# width (the app's only form factor), largest font (scale 1.3) for UI changes,
# one mp4 per changed interaction. The drivers own the matrix (they flip the
# theme with the twilight schedule disabled, force-stop before relaunch since
# RN reads the colour scheme at process start, and re-toggle the accessibility
# service afterwards); captures stream host-side via adb exec-out, never to
# device storage. See mobile/README.md ("Android build and device checks").
#
# Visual guard (was visual-check.sh): the pixel compare is superseded by the
# done-done primitive `done-done design <captures...> --mock <cell>=<mock>`
# (a judge fails stretched, clipped, overlapping, off-screen and blank-strip
# cells); run it over a journey's captures against the PR's approved mocks.
#
# Allocation rule: every Android journey needs an explicit lifetime device
# allocation (ANDROID_SERIAL=emulator-NNNN plus OWNVOICE_AVD_NAME); drivers
# refuse phone serials and AVD mismatches. The BYOKit-owned test phone is
# never eligible. Journeys marked spends: need a live writer or paid
# generation — done-done parks the run for approval before spending.

journeys:
  engine-protocol:
    description: "Host CLI proof: hello/schema/doctor, check, all verbs, voice.parse, error envelopes, 100k bound. No device, no model, no network."
    command: |
      set -u; fail=0; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; : > "$E/transcript.log"
      cd "$(git rev-parse --show-toplevel)"/packages/engine
      npm ci --no-audit --no-fund > "$E/npm-ci.log" 2>&1; code=$?; echo "npm-ci exit=$code" | tee -a "$E/transcript.log"; [ "$code" = 0 ] || fail=1
      npm run build > "$E/build.log" 2>&1; code=$?; echo "build exit=$code" | tee -a "$E/transcript.log"; [ "$code" = 0 ] || fail=1
      node dist/cli.mjs hello > /dev/null 2>&1 || { echo "FAIL: built CLI does not run" | tee -a "$E/transcript.log"; exit 1; }
      say() { printf '%s\n' "$*" | tee -a "$E/transcript.log"; }
      probe() { name=$1; want=$2; shift 2; out=$("$@" 2>&1); code=$?; printf '== %s ==\n$ %s\n%s\n[exit=%s]\n' "$name" "$*" "$out" "$code" >> "$E/transcript.log"; rc=0; if [ "$code" != "$want" ]; then say "FAIL $name: exit=$code want=$want"; rc=1; fi; printf '%s' "$out"; return $rc; }
      need() { if ! printf '%s' "$1" | grep -q "$2"; then say "FAIL: pattern [$2] missing"; fail=1; fi; }
      out=$(probe hello 0 node dist/cli.mjs hello) || fail=1; need "$out" '"protocol":2'; need "$out" "\"version\":\"$(node -p "require('./package.json').version")\""
      out=$(probe schema 0 node dist/cli.mjs schema) || fail=1; printf '%s' "$out" > "$E/schema.json"
      node -e "process.exit(process.version.slice(1).split('.')[0] >= 18 ? 0 : 1)" || { say "FAIL: node >= 18 required"; fail=1; }
      out=$(probe runtime-deps 0 npm ls --omit=dev) || fail=1; case "$out" in *"(empty)"*) : ;; *) say "FAIL: runtime dependencies present"; fail=1 ;; esac
      out=$(probe check 0 sh -c 'printf "%s" "{\"verb\":\"check\",\"drafts\":[\"At the end of the day, I shiped the fix; works now.\"],\"platform\":\"x\",\"rules\":{\"never\":[\"at the end of the day\"]},\"original\":\"I shipped the fix at 5.\"}" | node dist/cli.mjs') || fail=1; need "$out" 'At the end of the day'; need "$out" '"dropped".*"5"'; need "$out" '"limit":280' 
      probe verb-platforms 0 sh -c 'printf "%s" "{\"verb\":\"platforms\"}" | node dist/cli.mjs' > /dev/null || fail=1
      probe verb-brief 0 sh -c 'printf "%s" "{\"verb\":\"brief\",\"kind\":\"reply\",\"platform\":\"x\"}" | node dist/cli.mjs' > /dev/null || fail=1
      probe verb-split 0 sh -c 'printf "%s" "{\"verb\":\"split\",\"text\":\"hello world\",\"platform\":\"x\"}" | node dist/cli.mjs' > /dev/null || fail=1
      probe verb-voice.guide 0 sh -c 'printf "%s" "{\"verb\":\"voice.guide\",\"rules\":{\"never\":[]},\"post\":false}" | node dist/cli.mjs' > /dev/null || fail=1
      out=$(probe voice.parse 0 sh -c 'printf "%s" "{\"verb\":\"voice.parse\",\"markdown\":\"## How I reply\n- tried it today.\n- say more?\n\n## Never say\n- \\\"at the end of the day\\\"\n\"}" | node dist/cli.mjs') || fail=1; need "$out" 'tried it today'; need "$out" 'at the end of the day'
      out=$(probe unknown-verb 1 sh -c 'printf "%s" "{\"verb\":\"nope\"}" | node dist/cli.mjs') || fail=1; need "$out" 'unknown-verb'
      out=$(probe non-json 1 sh -c 'printf "not json" | node dist/cli.mjs') || fail=1; need "$out" 'bad-request'
      out=$(probe bad-platform 1 sh -c 'printf "%s" "{\"verb\":\"check\",\"drafts\":[\"hi\"],\"platform\":\"nope\"}" | node dist/cli.mjs') || fail=1; need "$out" 'bad-request'
      out=$(probe extreme-input 1 sh -c "node -e \"process.stdout.write(JSON.stringify({verb:'voice.parse',markdown:'x'.repeat(100001)}))\" | node dist/cli.mjs") || fail=1; need "$out" 'bad-request'
      probe extreme-boundary-ok 0 sh -c "node -e \"process.stdout.write(JSON.stringify({verb:'voice.parse',markdown:'x'.repeat(100000)}))\" | node dist/cli.mjs" > /dev/null || fail=1
      [ "$fail" = 0 ] && say "engine-protocol: PASS" || say "engine-protocol: FAIL"; exit "$fail"
    timeout: 15m

  fit-calibration:
    description: "Host proof: seeded local outcome files drive the fit-calibration CLI; checks G9 verdicts, exit codes and byte-for-byte preservation. No model, no sign-in, no emulator."
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/eval/fit-calibration.integration.ts >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 15m

  settings-navigation:
    description: "Android smoke: readiness-gated Home, Where the bubble shows, Your voice. Needs an explicit emulator allocation; proves routes render, not setup/sign-in/writers."
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"/mobile
      node e2e/settings.mjs "$E" browse >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  first-run-setup:
    description: "Android: welcome through writer choice, kit ChatGPT sign-in on the mockOpenAI stand-in, permission, practice insert; light and dark with plain-text scan. Needs an explicit emulator allocation and a stub+GPT release APK built with EXPO_PUBLIC_E2E_AUTH_BASE=http://10.0.2.2:21455 too, or ChatGPT opens its real login page (APK env: path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/first-run.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  chatgpt-sign-in-page:
    description: "Android: ChatGPT sign-in without a code. One button in setup opens the provider page inside the app, one Approve tap there finishes it (kit redirect against the mockOpenAI stand-in held behind an Approve page); light and dark, recording and card shots. Needs an explicit emulator allocation and a release APK built with EXPO_PUBLIC_E2E_AUTH_BASE=http://10.0.2.2:21455 (APK env). The real approval is for the captain to test; nobody signs in to ChatGPT for a proof."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"/mobile
      for t in light dark; do mkdir -p "$E/$t"; SIGNIN_PAGE=1 SIGNIN_RECORD="dd-${RUN_ID}" THEME=$t node e2e/signin-wait.mjs "$APK" "$E/$t" >"$E/driver-$t.log" 2>&1 || { echo "driver $t failed" >>"$E/driver.log"; exit 1; }; done
      echo "driver exit=0" >"$E/driver.log"
    timeout: 45m

  reply-drafts:
    description: "Android: bubble reply cards over a feed post, every card's wording checked against its own F6a label (Agree / Push back, kindly / Ask a question), edit/insert/copy, the insert's outcome record read back from the app's store and its 'Replies you inserted' screen, refusal legs on image-only and label-only composers. Full legs need a live writer: X_REPLIES_WRITER=pi starts the host's mobile/e2e/pi-writer.mjs and the build points the OpenRouter route at it with EXPO_PUBLIC_E2E_OPENROUTER_BASE (real DeepSeek Flash through @byokit/decide's pi backend, Haiku fallback, no provider key or sign-in, no spend), or a cloud writer (spends): OpenRouter by default (OPENROUTER_KEY_FILE), or the OpenCode Go writer with X_REPLIES_WRITER=opencode and OC_KEY (the desktop login's plan key), connected through the app's own connect field, picking OPENCODE_WORKSPACE (default Working2) when the key works with several; X_REPLIES_LEGS=refusal runs only the refusal legs, the extreme one included (a live writer is still connected, but no leg makes a writer request, so nothing is spent), X_REPLIES_LEGS=preflight connects the writer and proves one grounded, label-true generation answers, then stops. Needs APK env (path to the release APK, built per mobile/README.md)."
    spends: "one live generation per writer leg on a cloud writer; the pi writer route and the refusal legs spend nothing"
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/x-replies.mjs "$APK" "dd-${RUN_ID}" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  gmail-compose-reply:
    description: "Android: bubble reads a Gmail compose/reply body, polishes it, writes it back with an Inserted report. Currently only drivable on the signed-in test phone, which repo policy never allows: needs an explicit device allocation naming an eligible device before it can run."
    spends: "one signed-in device session with a live writer"
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"
      [ -n "${ANDROID_SERIAL:-}" ] || { echo "FAIL: no explicit device allocation (ANDROID_SERIAL unset); the test phone is never eligible" | tee "$E/driver.log"; exit 2; }
      echo "device=$ANDROID_SERIAL avd=${OWNVOICE_AVD_NAME:-unset}" | tee "$E/driver.log"; exit 2
    timeout: 45m

  gmail-thread-replies:
    description: "Android: on a Gmail-style lab fixture under Gmail's package id (mobile/e2e/fixture-gmail; needs an emulator without the real Gmail: Google APIs images preinstall it, so start the throwaway AVD with -writable-system and remove /product/app/PrebuiltGmail after adb root and adb remount, then reboot, the bubble tapped on an open thread reads the mail and offers Accept / Say no, kindly / Ask first cards grounded on it; the card's Reply opens the thread's own Reply and the draft is read back in the reply's body box with the app's verified-insert log, Send never pressed; the inbox shows the plain open-an-email note with no card. Light, dark and dark at 720x1280 with font 1.3, plus one recording of the reply hand-off. BEFORE_APK (a base build) runs first and expects the old withhold note. Writer: the host's e2e/pi-writer.mjs (real DeepSeek Flash, no key, no spend) through the OpenRouter key route, so the APK must be built with EXPO_PUBLIC_E2E_OPENROUTER_BASE=http://10.0.2.2:${PI_WRITER_PORT:-18793}/api/v1. Needs an explicit emulator allocation and APK env (path to that release APK)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      b=0; if [ -n "${BEFORE_APK:-}" ]; then GMAIL_BEFORE=1 node mobile/e2e/gmail-replies.mjs "$BEFORE_APK" "dd-${RUN_ID}" >"$E/driver-before.log" 2>&1; b=$?; echo "driver exit=$b" >>"$E/driver-before.log"; fi
      node mobile/e2e/gmail-replies.mjs "$APK" "dd-${RUN_ID}" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; [ $b -eq 0 ] || code=$b
      cp verify-artifacts/"dd-${RUN_ID}"/*.png verify-artifacts/"dd-${RUN_ID}"/*.txt verify-artifacts/"dd-${RUN_ID}"/*.json verify-artifacts/"dd-${RUN_ID}"/*.mp4 "$E"/ 2>/dev/null; exit $code
    timeout: 45m

  account-choices:
    description: "Android: writer list (phone/ChatGPT/Claude/OpenRouter/OpenCode Go), sign-in and writer/rating routing, live Claude draft+rewrite via claude-draft-proof.mjs, OpenRouter legs via openrouter-proof.mjs (OPENROUTER_SCENARIOS=negative is credit-free). OpenCode Go connects through the kit's add() (the workspace pick shows when the key works with several), proven fixture-backed in mobile/src/chatgpt/__tests__/OpenCodeRoute.test.ts and live via opencode-proof.mjs (connect, pick OPENCODE_WORKSPACE, one real draft) when OPENCODE_KEY_FILE is set; that leg needs an APK built with no E2E flags. OPENCODE_CARDS=1 swaps the draft for the \"What happens to your writing\" card (no writer, during connect, connected; light, dark, 1.3 font at 360dp) and spends nothing. Needs an explicit emulator allocation and APK env (path to the release APK, built per mobile/README.md)."
    spends: "one live Claude generation and one live OpenRouter generation for the full legs, plus one live OpenCode Go generation when OPENCODE_KEY_FILE is set"
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/claude-draft-proof.mjs "$APK" "$E/claude" >"$E/claude.log" 2>&1; c1=$?
      node mobile/e2e/openrouter-proof.mjs "$APK" "$E/openrouter" >"$E/openrouter.log" 2>&1; c2=$?
      c3=0; if [ -n "${OPENCODE_KEY_FILE:-}" ]; then node mobile/e2e/opencode-proof.mjs "${OPENCODE_APK:-$APK}" "$E/opencode" >"$E/opencode.log" 2>&1; c3=$?; fi
      echo "claude exit=$c1 openrouter exit=$c2 opencode exit=$c3" | tee "$E/driver.log"; [ $c1 -eq 0 ] && [ $c2 -eq 0 ] && [ $c3 -eq 0 ]
    timeout: 45m

  rewrite-selection:
    description: "Android: process-text/share rewrite sheet via direct intents (chips, copy-only sheet, warned number, hidden bubble, verdict note), light and dark. Needs an explicit emulator allocation and APK env (path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/rn08.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  reply-outcomes:
    description: "Android: insert to real local store and read-back, text opt-in and failed append, via the outcome-proof legs of own-post.mjs (light then dark). Needs an explicit emulator allocation and APK env (path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      OWNVOICE_OUTCOME_PROOF=1 OWNVOICE_THEME=light node mobile/e2e/own-post.mjs "$APK" "$E/scratch-light" >"$E/light.log" 2>&1; c1=$?
      OWNVOICE_OUTCOME_PROOF=1 OWNVOICE_THEME=dark node mobile/e2e/own-post.mjs "$APK" "$E/scratch-dark" >"$E/dark.log" 2>&1; c2=$?
      echo "light exit=$c1 dark exit=$c2" | tee "$E/driver.log"; [ $c1 -eq 0 ] && [ $c2 -eq 0 ]
    timeout: 45m

  reply-growth:
    description: "Android: day-later check-in answers onto seeded outcome records, weekly counts, growth screen, offline saves (airplane legs). Seeding follows the SQLite capture/edit/restore pattern in mobile/e2e/outcomes.mjs. Needs an explicit emulator allocation and APK env (path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/demo-growth.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  voice-rules:
    description: "Android: never-say phrases and the How-I-write note change drafted replies. Protocol: run the grow-mode leg five times with an empty never-say list and five times with the phrase set under Your voice (phrase in >=3 of 5 without, 0 of 5 with), then a lowercase-blunt note before/after on the same thread. Needs an explicit emulator allocation and a live writer."
    spends: "live writer generations for the repeated draft legs"
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/grow-reply-live.mjs mobile/e2e/grow-reply-cases.json "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  welcome-promise:
    description: "Android: the first-run welcome promises replies only on X, Reddit and LinkedIn and polish in other apps, never replies in any chat. Light and dark, default and largest font. Any release APK (no stub flags); OWNVOICE_BEFORE=1 captures the base build. Needs an explicit emulator allocation and APK env (path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/welcome.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 15m

  own-posts:
    description: "Android: blank composer asks for the one line, then drafts from it; edit one and insert with field read-back (OWNVOICE_THEME=dark for the dark pass). Needs an explicit emulator allocation after first-run.mjs setup and APK env (path to the release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/own-post.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  notes-posts:
    description: "Android (AA-11): raw notes shared to Ownvoice, or selected in the lab X composer, become three distinct X posts on the free phone writer through Posts for X: none copies the notes, reads as instructions or adds a number; every post has its rating rows and the phone fit says once that levels need an online writer; the first post is edited then copied (copied text read back by its fingerprint), and Replace puts a post in the composer (read back from the fixture); Post is never tapped. The base build's sheet is captured separately with NOTES_LEG=before. Needs an explicit emulator allocation, JAVA_HOME, the phone writer already made ready through setup, APK (a release APK with no stub flags) installed."
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      S="$(mktemp -d)"; trap 'rm -rf -- "$S"' EXIT; fail=0
      for leg in share replace; do NOTES_LEG=$leg node mobile/e2e/notes-posts.mjs "$S/$leg" "$E" >"$E/$leg.log" 2>&1 || fail=1; done
      OWNVOICE_THEME=dark node mobile/e2e/notes-posts.mjs "$S/dark" "$E" >"$E/share-dark.log" 2>&1 || fail=1
      echo "driver exit=$fail" | tee "$E/driver.log"; exit $fail
    timeout: 90m
  own-post-fit:
    description: "Android (AA-04): a new post typed in the X and Reddit composer fixtures opens Polish your post, and the typed post and every version carry the fit bar, light and dark; the base build (BEFORE_APK) shows no bar and asks for no rating. Levels come from a fixed-answer Jev stand-in through the real decide path, and the run fails unless every rating request carries the platform's post rubric and no parent post. Needs an explicit emulator allocation, JAVA_HOME, and stub+GPT release APKs built with EXPO_PUBLIC_E2E_AUTH_BASE=http://10.0.2.2:21455 EXPO_PUBLIC_JEV_KEY=stand-in EXPO_PUBLIC_E2E_JEV_BASE=http://10.0.2.2:18612 (APK for this change, BEFORE_APK for the base)."
    command: |
      set -u; : "${APK:?path to release APK required}"; : "${BEFORE_APK:?path to the base release APK required}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      S="$(mktemp -d)"; trap 'rm -rf -- "$S"' EXIT
      node mobile/e2e/first-run.mjs "$BEFORE_APK" "$S/setup" >"$S/setup.log" 2>&1 || { tail -40 "$S/setup.log"; exit 1; }
      OWNVOICE_BEFORE=1 node mobile/e2e/own-post-fit.mjs "$BEFORE_APK" "$E/before" >"$E/before.log" 2>&1; c1=$?
      adb -s "$ANDROID_SERIAL" install -r "$APK" >/dev/null 2>&1; node mobile/e2e/own-post-fit.mjs "$APK" "$E/after" >"$E/after.log" 2>&1; c2=$?
      printf '%s\n' '{"target":{"version":"'"$(git rev-parse --short HEAD)"'"},"start":"setup finished with ChatGPT on the base build","steps":["type a new post in the X composer and tap the bubble","read the Polish your post panel and scroll it","repeat in the Reddit composer","repeat both in dark mode","install this change over the base build and repeat"],"result":"before: no fit bar on any card; after: the typed post and each version show their own fit level on X and Reddit"}' > "$E/steps.json"
      echo "before exit=$c1 after exit=$c2" | tee "$E/driver.log"; [ $c1 -eq 0 ] && [ $c2 -eq 0 ]
    timeout: 45m

  polish-talk-deadline:
    description: "Android: 'Looks nice' typed in the blank X-style composer on the stub phone writer; the Shorter version that talks to the person never shows, 'Still working' shows while a card is coming, and the missing card collapses at the phone's card deadline. Needs an explicit emulator allocation after first-run.mjs setup and APK env (stub+GPT release APK, built per mobile/README.md)."
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      OWN_POST_TALK=1 node mobile/e2e/own-post.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 30m

  typing-checks:
    description: "Android: readable-field counts, honest capped-field disclosure, disabled partial Fix and Insert, fresh-field recovery, plus the overlay typing-fix leg. Needs an explicit emulator allocation."
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/typing-limit.mjs "$E" after light >"$E/driver.log" 2>&1; c1=$?
      node mobile/e2e/overlay-proof.mjs "$E/light" --typing-fix >>"$E/driver.log" 2>&1; c2=$?
      echo "typing exit=$c1 overlay-fix exit=$c2" | tee -a "$E/driver.log"; [ $c1 -eq 0 ] && [ $c2 -eq 0 ]
    timeout: 45m

  polish-output:
    description: "Android: real cloud-writer polish panels (autosave/split-capital/real message/nonsense/empty/mash/max), light/dark and narrow (font 1.3; POLISH_ROUNDS=narrow-dark adds narrow dark), with the stub-text provenance guard; nonsense and mash must show the decline line on screen without scrolling and mash no made-up spelling fixes; the split-capital case types a run-on with no stops and fails unless a version actually splits it with capitals kept. POLISH_ONLY and POLISH_ROUNDS narrow the cases and rounds. Needs an explicit emulator allocation, a live writer, and APK env (path to the release APK, built per mobile/README.md). WRITER=openrouter (default, OPENROUTER_KEY_FILE) or opencode (OPENCODE_KEY: the OpenCode Go plan key)."
    spends: "live cloud generations for the polish panels"
    command: |
      set -u; : "${APK:?path to release APK required, built per mobile/README.md}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)"
      node mobile/e2e/openrouter-polish-sheets.mjs "$APK" "$E" >"$E/driver.log" 2>&1; code=$?; echo "driver exit=$code" >>"$E/driver.log"; exit $code
    timeout: 45m

  phone-agent-length:
    description: "Lab phone agent (EXPO_PUBLIC_PHONE_AGENT=1): every one of the six fixture tasks (mobile/e2e/agent-tasks.json), loop and script, must come out shorter than the person's own words (the instruction, or the typed panel note when shorter) with facts and names kept (P1) and writing rules kept (P2). Grades a folder of live A5LIVE captures (<mode>-<task>/events.json, from a lab build with the scratch live adapter) with evaluate.mjs --gate. CAPTURES env names that folder."
    command: |
      set -u; : "${CAPTURES:?folder of live <mode>-<task>/events.json captures}"; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)/mobile"
      node --experimental-strip-types reports/phone-agent-live/evaluate.mjs "$CAPTURES" --gate >"$E/grade.jsonl" 2>"$E/grade.err"; code=$?; echo "gate exit=$code" | tee "$E/driver.log"; exit $code
    timeout: 5m

  desktop-side-panel:
    description: "Desktop Chrome: the unpacked side panel reads the post on a fixture served as x.com (modeled on x.com markup, not a captured copy; the real site returns 403 to automated browsers), shows the plain note when there is nothing to reply to, sends no request beyond the fixture page; whole Chrome window shots (post page plus the open side panel), light and dark. Builds desktop/dist from the commit under test first. Needs PLAYWRIGHT_DIR (a playwright install)."
    command: |
      set -u; E="$DONE_DONE_EVIDENCE_ROOT"; mkdir -p "$E"; cd "$(git rev-parse --show-toplevel)/desktop"
      # Logs stay out of the evidence folder (only the panel captures belong there) and print on failure.
      L="$(mktemp)"; trap 'rm -f "$L"' EXIT
      { npm ci && npm run build && env -u WAYLAND_DISPLAY xvfb-run -a -s "-screen 0 1600x900x24" node e2e/side-panel.mjs dist "$E"; } >"$L" 2>&1; code=$?
      [ $code -eq 0 ] || cat "$L"; exit $code
    timeout: 10m
