<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ownvoice</title>
<link rel="stylesheet" href="panel.css">
<main>
  <h1>Ownvoice</h1>
  <section id="post" hidden>
    <h2>The post I read</h2>
    <p id="author"></p>
    <p id="text"></p>
    <p id="composer" class="muted"></p>
  </section>
  <section id="note">
    <h2 id="note-title"></h2>
    <p id="note-detail" class="muted"></p>
  </section>
  <button id="again" type="button">Read again</button>
  <p class="muted">Nothing leaves your computer.</p>
</main>
<script src="panel.js"></script>
