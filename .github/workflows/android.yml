name: Android

on:
  push:
    branches: [main]
  pull_request:

# A superseded push/PR run is cancelled so a queue of them does not hold runners.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: docs, evidence and engine-only changes cannot affect the legacy
  # Android app or the Expo native project, so those jobs are skipped rather than run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.filter.outputs.host }}
      mobile: ${{ steps.filter.outputs.mobile }}
      native: ${{ steps.filter.outputs.native }}
      legacy: ${{ steps.filter.outputs.legacy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; fi
          changed="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only "$base" HEAD 2>/dev/null || echo .github/workflows/android.yml)"
          printf '%s\n' "$changed" > /tmp/changed.txt
          # Docs-only (*.md and docs/, but not the CONSTRAINTS.md floor): skip every
          # heavy job. Skipped jobs still report, so required checks pass.
          if ! grep -vE '\.md$|^docs/' /tmp/changed.txt | grep -q . && ! grep -q '^CONSTRAINTS.md$' /tmp/changed.txt; then
            printf '%s\n' host=false mobile=false native=false legacy=false >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
            exit 0
          fi
          { grep -vE '\.md$|(^|/)(reports|artifacts|verify-artifacts)/' /tmp/changed.txt | grep -qE '^(mobile/|packages/engine/|scripts/|\.done-done\.yaml|\.no-mistakes\.yaml|\.github/workflows/android\.yml)' || grep -q '^CONSTRAINTS.md$' /tmp/changed.txt; } && echo "host=true" >> "$GITHUB_OUTPUT" || echo "host=false" >> "$GITHUB_OUTPUT"
          { grep -qE '^mobile/' /tmp/changed.txt && echo "mobile=true" || echo "mobile=false"; } >> "$GITHUB_OUTPUT"
          { grep -qE '^(mobile/(modules/ownvoice-native/|package(-lock)?\.json|app\.config\.js|plugins/|src/core/defaultApps\.json)|\.github/workflows/android\.yml)'  /tmp/changed.txt && echo "native=true" || echo "native=false"; } >> "$GITHUB_OUTPUT"
          { grep -qE '^(app/|link/|gradle/|gradlew|build\.gradle|settings\.gradle|gradle\.properties|mobile/src/core/defaultApps\.json|\.github/workflows/android\.yml)' /tmp/changed.txt && echo "legacy=true" || echo "legacy=false"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  mobile:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # The floor guard needs a merge base against main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            packages/engine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run floor
      # The floor guard's own real Git/CLI journey proves the whole-file and scoped
      # test-diet paths end to end in isolated histories, outside the app build.
      - run: HOME="$RUNNER_TEMP" XDG_CONFIG_HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" node scripts/integration/floor-guard.mjs "$RUNNER_TEMP/floor-guard-scratch" "$RUNNER_TEMP/floor-guard-evidence"
        working-directory: .
      # Regenerating the Android project from the Expo config and plugins catches a
      # broken app.config.js/plugin before it reaches a release tag. Only mobile
      # changes can affect it.
      - if: needs.changes.outputs.mobile == 'true'
        run: npx expo prebuild -p android --no-install
      - run: npm ci
        working-directory: packages/engine
      - run: npm run lint
        working-directory: packages/engine
      - run: npm run typecheck
        working-directory: packages/engine
      - run: npm test
        working-directory: packages/engine
      # The host proof gate: the engine-protocol journey drives the real CLI
      # and self-verifies (exit 1 on any mismatch). done-done run needs no
      # model or sign-in; run evidence stays on the runner, receipts bind HEAD.
      - run: npm install -g done-done-axi
      - run: done-done run engine-protocol

  # Retain native tests until passing device journeys cover their features.
  # Build inputs outside the module also affect this job.
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - run: ./gradlew :ownvoice-native:testDebugUnitTest :byokit-overlay:testDebugUnitTest assembleDebug
        working-directory: mobile/android

  # Legacy sources, build config and shared app defaults affect this job.
  # The Expo release APK is built by apk-release.yml on a version tag.
  legacy:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug :app:testDebugUnitTest
