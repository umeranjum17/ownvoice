name: Android

on:
  push:
    branches: [main]
  # No `edited`: a title or body edit starts no run (nothing here reads the body).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

# A superseded PR run is cancelled so a queue of them does not hold runners.
# main pushes carry no PR number, so they get their own group and are never cancelled.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: docs, evidence and engine-only changes cannot affect the legacy
  # Android app or the Expo native project, so those jobs are skipped rather than run.
  changes:
    # Drafts cost nothing: every other job needs this one, so they skip too.
    # ready_for_review runs the suite once the PR is ready.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.filter.outputs.host }}
      mobile: ${{ steps.filter.outputs.mobile }}
      native: ${{ steps.filter.outputs.native }}
      legacy: ${{ steps.filter.outputs.legacy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push to main that is just a merged PR repeats nothing the PR already ran:
          # the PR's head had a green run here (its `changes` job ran, so not a draft
          # skip), main was already in the PR head, and the pushed tree is the PR head's
          # tree. Anything else (direct push, stale branch, no green run) runs in full.
          tested() {
            [ "${{ github.event_name }}" = push ] || return 1
            sha="${{ github.sha }}"; repo="${{ github.repository }}"
            pr="$(gh api "repos/$repo/commits/$sha/pulls" --jq "[.[] | select(.merge_commit_sha == \"$sha\")][0].number // empty")" || return 1
            [ -n "$pr" ] || return 1
            head="$(gh api "repos/$repo/pulls/$pr" --jq .head.sha)" || return 1
            git fetch -q origin "refs/pull/$pr/head" || return 1
            [ "$(git rev-parse FETCH_HEAD)" = "$head" ] || return 1
            [ "$(git rev-parse "$sha^{tree}")" = "$(git rev-parse "$head^{tree}")" ] || return 1
            git merge-base --is-ancestor "${{ github.event.before }}" "$head" || return 1
            for id in $(gh api "repos/$repo/actions/workflows/android.yml/runs?head_sha=$head&event=pull_request&status=success" --jq '.workflow_runs[].id'); do
              [ "$(gh api "repos/$repo/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "changes" and .conclusion == "success")] | length')" = 1 ] && return 0
            done
            return 1
          }
          if tested; then
            echo "main push is PR merge of an already-tested head: skipping heavy jobs"
            printf '%s\n' host=false mobile=false native=false legacy=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; fi
          changed="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only "$base" HEAD 2>/dev/null || echo .github/workflows/android.yml)"
          printf '%s\n' "$changed" > /tmp/changed.txt
          # Docs-only (*.md and docs/, but not the CONSTRAINTS.md floor): skip every
          # heavy job. Skipped jobs still report, so required checks pass.
          if ! grep -vE '\.md$|^docs/' /tmp/changed.txt | grep -q . && ! grep -q '^CONSTRAINTS.md$' /tmp/changed.txt; then
            printf '%s\n' host=false mobile=false native=false legacy=false >> "$GITHUB_OUTPUT"
            cat "$GITHUB_OUTPUT"
            exit 0
          fi
          # Top-level docs, docs/ and .sign-off/ evidence never trigger a heavy job.
          { grep -vE '(^|/)(README|VISION|AGENTS|CLAUDE)\.md$|^docs/|^\.sign-off/' /tmp/changed.txt || true; } > /tmp/code.txt
          { grep -vE '\.md$|(^|/)(reports|artifacts|verify-artifacts)/' /tmp/code.txt | grep -qE '^(mobile/|packages/engine/|scripts/|\.done-done\.yaml|\.no-mistakes\.yaml|\.github/workflows/android\.yml)' || grep -q '^CONSTRAINTS.md$' /tmp/changed.txt; } && echo "host=true" >> "$GITHUB_OUTPUT" || echo "host=false" >> "$GITHUB_OUTPUT"
          { grep -qE '^mobile/' /tmp/code.txt && echo "mobile=true" || echo "mobile=false"; } >> "$GITHUB_OUTPUT"
          { grep -qE '^(mobile/(modules/ownvoice-native/|package(-lock)?\.json|app\.config\.js|plugins/|src/core/defaultApps\.json)|\.github/workflows/android\.yml)'  /tmp/code.txt && echo "native=true" || echo "native=false"; } >> "$GITHUB_OUTPUT"
          { grep -qE '^(app/|link/|gradle/|gradlew|build\.gradle|settings\.gradle|gradle\.properties|mobile/src/core/defaultApps\.json|\.github/workflows/android\.yml)' /tmp/code.txt && echo "legacy=true" || echo "legacy=false"; } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  mobile:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # The floor guard needs a merge base against main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            packages/engine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run floor
      # The floor guard's own real Git/CLI journey proves the whole-file and scoped
      # test-diet paths end to end in isolated histories, outside the app build.
      - run: HOME="$RUNNER_TEMP" XDG_CONFIG_HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" node scripts/integration/floor-guard.mjs "$RUNNER_TEMP/floor-guard-scratch" "$RUNNER_TEMP/floor-guard-evidence"
        working-directory: .
      # Regenerating the Android project from the Expo config and plugins catches a
      # broken app.config.js/plugin before it reaches a release tag. Only mobile
      # changes can affect it.
      - if: needs.changes.outputs.mobile == 'true'
        run: npx expo prebuild -p android --no-install
      - run: npm ci
        working-directory: packages/engine
      - run: npm run lint
        working-directory: packages/engine
      - run: npm run typecheck
        working-directory: packages/engine
      - run: npm test
        working-directory: packages/engine
      # The host proof gate: the engine-protocol journey drives the real CLI
      # and self-verifies (exit 1 on any mismatch). done-done run needs no
      # model or sign-in; run evidence stays on the runner, receipts bind HEAD.
      - run: npm install -g done-done-axi
      - run: done-done run engine-protocol

  # Retain native tests until passing device journeys cover their features.
  # Build inputs outside the module also affect this job.
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild -p android --no-install
      - run: ./gradlew :ownvoice-native:testDebugUnitTest :platform-kits-overlay:testDebugUnitTest assembleDebug
        working-directory: mobile/android

  # Legacy sources, build config and shared app defaults affect this job.
  # The Expo release APK is built by apk-release.yml on a version tag.
  legacy:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug :app:testDebugUnitTest
      - if: ${{ hashFiles('link/**') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ hashFiles('link/**') != '' }}
        run: cd link && node --test
