name: Release engine

# Later releases use npm trusted publishing; no stored npm token.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ownvoice-engine-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.20.0
      - run: npm ci --no-audit --no-fund
      - run: npm run release -- ${{ inputs.dry_run && '--dry-run' || '' }}
