name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'packages/engine/src/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'packages/engine/src/**', '.github/workflows/desktop.yml']

# A superseded PR run is cancelled so a queue of them does not hold runners.
# main pushes carry no PR number, so they get their own group and are never cancelled.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
