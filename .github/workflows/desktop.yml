name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'packages/engine/src/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'packages/engine/src/**', '.github/workflows/desktop.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
