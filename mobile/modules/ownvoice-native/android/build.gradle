plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.ownvoice.bridge'
version = '0.1.0'

def defaultApps = new groovy.json.JsonSlurper().parse(file("../../../src/core/defaultApps.json"))

android {
  buildFeatures { buildConfig true }
  namespace "dev.ownvoice.bridge"
  defaultConfig {
    buildConfigField "String[]", "DEFAULT_ON", "new String[]{" + defaultApps.collect { '"' + it + '"' }.join(",") + "}"
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The floating bubble (window host, per-app rules, keyboard inset, focused-field insert) lives in the kit (OV-7).
  implementation project(':platform-kits-overlay')
  implementation 'com.facebook.react:react-android'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
